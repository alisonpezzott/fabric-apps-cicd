# CI: checks every pull request. Needs no secret and touches no workspace:
# the semantic models are bound to placeholder IDs, because
# `fabric-app-data generate` only writes IDs into the bundle and calls
# nothing. deploy.yml binds the real ones.
#
# The environments and the scripts are always checked. The app steps run
# only once app/ holds an app (app/package.json): in the template itself,
# and in a new repository before its app is added, they are skipped.
#
# No paths filter: "check" is a required status on main, and a workflow
# skipped by a filter never reports it, which would block a pull request
# that only changes docs.

name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install the scripts
        run: pip install -r scripts/requirements.txt ruff mypy types-PyYAML

      - name: Environments
        run: python scripts/environments.py --check

      - name: Scripts (ruff, mypy)
        run: |
          ruff check scripts
          ruff format --check scripts
          mypy --strict scripts

      - name: App in app/
        id: app
        run: |
          if [ -f app/package.json ]; then present=true; else present=false; fi
          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "App in app/: $present"

      - uses: actions/setup-node@v5
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install the app
        if: steps.app.outputs.present == 'true'
        run: npm ci --prefix app

      # src/fabric.generated.ts is gitignored; tests and build import it.
      - name: Bind placeholder semantic models
        if: steps.app.outputs.present == 'true'
        run: |
          environment=$(python scripts/environments.py --branch "$GITHUB_BASE_REF")
          python scripts/deploy_app.py --environment "${environment:-prod}" --bind-only --placeholder

      # Not blocking: the dataapp template's hook use-semantic-model-query.ts
      # has a known react-hooks/set-state-in-effect error. Remove
      # continue-on-error once your app lints clean.
      - name: Lint
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npm run lint
        continue-on-error: true

      - name: Type check
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npx tsc -b

      - name: Test
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npm test

      - name: Build
        if: steps.app.outputs.present == 'true'
        working-directory: app
        run: npm run build:fabric
