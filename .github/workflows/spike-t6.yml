# Spike T6 (docs/spike-phase-0.md): deploy app-dre-sankey from a hosted
# Linux runner with a service principal, with no local deployment history.
#
# Needs a GitHub environment named "spike" with these secrets:
#   FAB_TENANT_ID, FAB_CLIENT_ID, FAB_CLIENT_SECRET   service principal
#   SPIKE_WORKSPACE_ID                                 workspace of the app
#   MODEL_WORKSPACE_ID, MODEL_ITEM_ID                  semantic model the app reads
# IDs are secrets too, so the logs mask them.

name: Spike T6 - deploy from Linux

on:
  workflow_dispatch:
    inputs:
      encryption_fallback:
        description: Set RAYFIN_ENCRYPTION_FALLBACK_ENABLED=true (false confirms the keychain error)
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: spike
    concurrency:
      group: deploy-spike
      cancel-in-progress: false
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app-dre-sankey
    env:
      RAYFIN_ENCRYPTION_FALLBACK_ENABLED: ${{ inputs.encryption_fallback && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app-dre-sankey/package-lock.json

      - name: Install
        run: npm ci

      - name: Check IDs
        env:
          SPIKE_WORKSPACE_ID: ${{ secrets.SPIKE_WORKSPACE_ID }}
          MODEL_WORKSPACE_ID: ${{ secrets.MODEL_WORKSPACE_ID }}
          MODEL_ITEM_ID: ${{ secrets.MODEL_ITEM_ID }}
        run: |
          guid='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          for name in SPIKE_WORKSPACE_ID MODEL_WORKSPACE_ID MODEL_ITEM_ID; do
            if [[ ! "${!name}" =~ $guid ]]; then echo "::error::$name is not a GUID"; exit 1; fi
          done

      - name: Bind the semantic model
        env:
          MODEL_WORKSPACE_ID: ${{ secrets.MODEL_WORKSPACE_ID }}
          MODEL_ITEM_ID: ${{ secrets.MODEL_ITEM_ID }}
        run: |
          npx fabric-app-data init
          npx fabric-app-data add semanticModel modelo_dre -w "$MODEL_WORKSPACE_ID" -i "$MODEL_ITEM_ID" -p spike
          npx fabric-app-data use spike -o src/fabric.generated.ts

      - name: Test
        run: npm test -- --exclude scripts/validate-visual.spec.mjs

      - name: Sign in as service principal
        env:
          FAB_TENANT_ID: ${{ secrets.FAB_TENANT_ID }}
          FAB_CLIENT_ID: ${{ secrets.FAB_CLIENT_ID }}
          FAB_CLIENT_SECRET: ${{ secrets.FAB_CLIENT_SECRET }}
        run: |
          npx rayfin login --service-principal \
            --client-id "$FAB_CLIENT_ID" --client-secret "$FAB_CLIENT_SECRET" --tenant "$FAB_TENANT_ID"

      - name: Deploy
        env:
          SPIKE_WORKSPACE_ID: ${{ secrets.SPIKE_WORKSPACE_ID }}
        run: |
          npx rayfin up --workspace-id "$SPIKE_WORKSPACE_ID" --item-name app-dre-sankey --yes --output json > up.json
          jq '{status, item: .deployment.itemName, warnings}' up.json

      - name: Status
        run: npx rayfin up status --json | jq '.endpointHealth | {reachable, httpStatus, authenticated, errorCode}'
